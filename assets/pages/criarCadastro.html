<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Cadastro - IaraGames</title>

    <link rel="icon" href="../imagens/joystick.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gantari:ital,wght@0,100..900;1,100..900&family=Kanit:ital,wght@0,100..900;1,100..900&family=Michroma&family=Nabla&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <form id="dados-cadastro" name="dados-cadastro" action="processar_cadastro.php" method="POST" class="form">
        <h1>Criar Cadastro</h1>
        
    <div class="box-cad">
        <label for="nome">Nome completo:</label>
        <i class="bi bi-person"></i>
        <input type="text" placeholder="Ex: João Silva" id="nome" name="nome" required>
    </div>
    
    <div class="box-cad">
        <label for="email">Email:</label>
        <i class="bi bi-envelope"></i>
        <input type="email" placeholder="Ex:abcd@gmail.com" id="email" name="email" required>
    </div>

    <div class="box-cad">
        <label for="telefone">Telefone:</label>
        <i class="bi bi-telephone"></i>
        <input type="tel" placeholder="Ex: (00) 00000-0000" id="telefone" name="telefone" required>
    </div>

    <div class="box-cad">
        <label for="data-nascimento">Data de Nascimento:</label>
        <i class="bi bi-calendar"></i>
        <input type="date" id="data-nascimento" name="data-nascimento" required>   
    </div>

    <div class="box-cad">
        <label for="cpf">CPF:</label>
        <input type="text" placeholder="Ex: 000.000.000-00" id="cpf" name="cpf" required>
    </div>

    <div class="box-cad">
        <label for="senha">Senha:</label>
        <i class="bi bi-eye-slash" id="toggleSenha"></i>
        <input type="password" placeholder="Digite sua senha" id="senha" name="senha" required>
    </div>

    <div class="box-cad">
        <label for="confirmar-senha">Confirmar Senha:</label>
        <i class="bi bi-eye-slash" id="toggleConfirmarSenha"></i>
        <input type="password" placeholder="Confirme sua senha" id="confirmar-senha" name="confirmar-senha" required>
    </div>

<div class="box-cad termo-container"> 
    <input type="radio" class="radio" id="termo" name="termo">
    <label for="termo"> Li e aceito os termos de uso e privacidade</label>
</div>

    <div class="box-botoes">
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
        <a href="cadastro.html">Já tenho cadastro</a>
    </div>
    
    
    </form>

        <a href="../../index.html">Voltar para a página inicial</a>
</body>
</html>
